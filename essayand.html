<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AND Logic Gate</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef7ff 0%, #f5f0ff 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #1f2937;
      padding: 30px 20px;
    }

    .card {
      width: min(920px, 100%);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(59, 130, 246, 0.12);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      padding: 32px 24px 24px;
      text-align: center;
    }

    h2 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3vw, 2.7rem);
      color: #1d4ed8;
      font-weight: 800;
    }

    .intro {
      margin: 0 auto 24px;
      max-width: 680px;
      font-size: 1.08rem;
      line-height: 1.8;
      font-weight: 600;
      color: #374151;
    }

    .button-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    button {
      background: linear-gradient(135deg, #10b981, #3b82f6);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(59, 130, 246, 0.18);
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .image-box {
      display: flex;
      justify-content: center;
      margin: 10px auto 20px;
      background: linear-gradient(180deg, #f8fbff, #f5f3ff);
      border: 1px solid #dbeafe;
      border-radius: 20px;
      padding: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    .explanation {
      margin-top: 20px;
      background: #fefce8;
      border: 1px solid #facc15;
      border-radius: 18px;
      padding: 18px 20px;
      text-align: left;
    }

    .explanation h3 {
      margin: 0 0 10px;
      color: #854d0e;
      font-size: 1.2rem;
    }

    .explanation p {
      margin: 0 0 12px;
      font-size: 1rem;
      line-height: 1.8;
      font-weight: 600;
      color: #4b5563;
    }

    pre {
      margin: 0;
      padding: 16px 18px;
      background: #111827;
      color: #d1fae5;
      border-radius: 12px;
      overflow-x: auto;
      font-size: 0.95rem;
      line-height: 1.7;
      font-family: Consolas, 'Courier New', monospace;
    }

    .home-row {
      margin-top: 24px;
      text-align: center;
    }

    .home-btn {
      display: inline-block;
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>AND Logic Gate</h2>

    <p class="intro">
      An AND gate only turns ON when both inputs are ON. Click each combination below to see how the gate behaves.
    </p>

    <div class="button-group">
      <button onclick="document.getElementById('myImage').src='and2off.PNG'">0 AND 0</button>
      <button onclick="document.getElementById('myImage').src='andoffon.PNG'">0 AND 1</button>
      <button onclick="document.getElementById('myImage').src='andonoff.PNG'">1 AND 0</button>
      <button onclick="document.getElementById('myImage').src='and2on.png'">1 AND 1</button>
    </div>

    <div class="image-box">
      <img id="myImage" src="and2off.PNG" alt="AND gate output">
    </div>

    <div class="explanation">
      <h3>Beginner-friendly explanation</h3>
      <p>The AND gate works like “both must be true.”</p>
      <pre><code>0 AND 0 → 0
0 AND 1 → 0
1 AND 0 → 0
1 AND 1 → 1</code></pre>
    </div>

    <div class="home-row">
      <a class="home-btn" href="index.html">Back to Home</a>
    </div>
  </div>
</body>
</html>
